version: "3.8"

# Root Docker Compose file for ClassGuard
# Allows running `docker compose up -d` from the repository root directory.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: classguard-backend
    environment:
      - DATABASE_URL=postgres://${DB_USER:-classguard}:${DB_PASSWORD:-classguard_secure_db_pass}@db:5432/${DB_NAME:-classguard}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-classguard_secure_redis_pass}@redis:6379/0
      - DJANGO_SETTINGS_MODULE=core.settings
      - SECRET_KEY=${SECRET_KEY:-django-insecure-classguard-production-docker-key-change-me}
      - DEBUG=${DEBUG:-False}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,backend,nginx}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost,http://localhost:80,http://localhost:8080,http://localhost:5173}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_WHATSAPP_NUMBER=${TWILIO_WHATSAPP_NUMBER:-}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER:-}
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    volumes:
      - media-data:/app/media
      - static-data:/app/staticfiles
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/admin/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: classguard-celery
    command: celery -A core worker --pool=prefork --concurrency=2 --loglevel=info
    environment:
      - DATABASE_URL=postgres://${DB_USER:-classguard}:${DB_PASSWORD:-classguard_secure_db_pass}@db:5432/${DB_NAME:-classguard}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-classguard_secure_redis_pass}@redis:6379/0
      - DJANGO_SETTINGS_MODULE=core.settings
      - SECRET_KEY=${SECRET_KEY:-django-insecure-classguard-production-docker-key-change-me}
      - DEBUG=${DEBUG:-False}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_WHATSAPP_NUMBER=${TWILIO_WHATSAPP_NUMBER:-}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER:-}
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - media-data:/app/media
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  frontend:
    build:
      context: ./frontend_new
      dockerfile: Dockerfile
    container_name: classguard-frontend
    depends_on:
      - backend
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: classguard-db
    environment:
      - POSTGRES_USER=${DB_USER:-classguard}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-classguard_secure_db_pass}
      - POSTGRES_DB=${DB_NAME:-classguard}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-classguard}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: classguard-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-classguard_secure_redis_pass} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-classguard_secure_redis_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: classguard-nginx
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static-data:/app/staticfiles:ro
      - media-data:/app/media:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  redis-data:
  pg-data:
  media-data:
  static-data:
