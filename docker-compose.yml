version: "3.8"

# ClassGuard Docker Compose Configuration
# Production-ready multi-service orchestration with health checks and resource limits.
# Usage: docker compose up --pull always -d

services:
  # ============================================================================
  # PostgreSQL Database
  # ============================================================================
  db:
    image: postgres:15-alpine
    container_name: classguard-db
    environment:
      POSTGRES_USER: ${DB_USER:-classguard}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-classguard_secure_db_pass}
      POSTGRES_DB: ${DB_NAME:-classguard}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-classguard}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    networks:
      - classguard-network

  # ============================================================================
  # Redis Cache & Message Broker
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: classguard-redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-classguard_secure_redis_pass}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-classguard_secure_redis_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 256M
    networks:
      - classguard-network

  # ============================================================================
  # Django Backend (Daphne + ASGI)
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      cache_from:
        - classguard-backend:latest
    image: classguard-backend:latest
    container_name: classguard-backend
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: core.settings
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend,nginx}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:80,http://localhost:8080,http://localhost:5173}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media-data:/app/media
      - static-data:/app/staticfiles
    ports:
      - "8000:8000"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
        reservations:
          memory: 1G
          cpus: "1.0"
    networks:
      - classguard-network

  # ============================================================================
  # Celery Worker (Async Tasks)
  # ============================================================================
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      cache_from:
        - classguard-backend:latest
    image: classguard-backend:latest
    container_name: classguard-celery
    command: celery -A core worker --pool=prefork --concurrency=2 --loglevel=info
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: core.settings
      DEBUG: ${DEBUG:-False}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - media-data:/app/media
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 512M
          cpus: "0.5"
    networks:
      - classguard-network

  # ============================================================================
  # React Frontend (Vite build + Nginx)
  # ============================================================================
  frontend:
    build:
      context: ./frontend_new
      dockerfile: Dockerfile
      cache_from:
        - classguard-frontend:latest
    image: classguard-frontend:latest
    container_name: classguard-frontend
    depends_on:
      - backend
    ports:
      - "8080:8080"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    networks:
      - classguard-network

  # ============================================================================
  # Nginx Reverse Proxy
  # ============================================================================
  nginx:
    image: nginx:alpine
    container_name: classguard-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static-data:/app/staticfiles:ro
      - media-data:/app/media:ro
    depends_on:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    networks:
      - classguard-network

volumes:
  pg-data:
    driver: local
  redis-data:
    driver: local
  media-data:
    driver: local
  static-data:
    driver: local

networks:
  classguard-network:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1500
