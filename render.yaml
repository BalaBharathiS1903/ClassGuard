services:
  - type: web
    name: classguard-backend
    runtime: python
    region: oregon
    buildCommand: |
      : "${DATABASE_URL:?Set DATABASE_URL in the Render dashboard}" "${REDIS_URL:?Set REDIS_URL in the Render dashboard}" &&
      cd backend && pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: cd backend && daphne -b 0.0.0.0 -p $PORT core.asgi:application
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "classguard-9om7.onrender.com,localhost"
      - key: CORS_ORIGINS
        value: "https://classguard-hq531y8ja-balabharathis1903s-projects.vercel.app,http://localhost:5173"
      - key: DJANGO_SETTINGS_MODULE
        value: core.settings
      - key: PYTHON_VERSION
        value: "3.11.0"
